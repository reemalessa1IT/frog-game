<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ملفات الجريمة — لعبة العلوم الجنائية</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&family=Press+Start+2P&display=swap">
<style>
:root{--page:#05060c;--ink:#eef0ff;--neon:#3df2c9;--amber:#ffc857;--red:#ff4d6d;--panel:rgba(9,11,26,.92);--line:#4a5199;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#05060c}}
:root[data-theme="dark"]{--page:#05060c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--page);display:grid;place-items:center;overflow:hidden;font-family:'Cairo',system-ui,'Segoe UI',Tahoma,sans-serif;color:var(--ink)}
#stage{position:relative;width:min(100vw,calc((100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))*16/9));aspect-ratio:16/9;container-type:inline-size;overflow:hidden;background:#000;user-select:none;-webkit-user-select:none;touch-action:manipulation;cursor:crosshair}
#c{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}
.bar{position:absolute;left:0;right:0;height:0;background:#000;transition:height .7s cubic-bezier(.2,.8,.2,1);z-index:5}
.bar.t{top:0}.bar.b{bottom:0}
body.cine .bar{height:12%}
#cap{position:absolute;left:5%;right:5%;bottom:2cqw;z-index:9;text-align:center;font-size:max(13px,2.3cqw);font-weight:800;line-height:1.35;text-shadow:0 .2cqw 0 #000,0 0 .8cqw #000;pointer-events:none;min-height:1.4em}
#cap .who{color:var(--amber);margin-inline-end:.5em}
#hud{position:absolute;top:1.2cqw;left:2cqw;right:2cqw;z-index:6;display:flex;gap:1.2cqw;align-items:center;font-size:max(11px,1.8cqw);font-weight:800;transition:opacity .4s;pointer-events:none}
#hud span{background:rgba(5,6,16,.78);border:.25cqw solid var(--line);padding:.35cqw 1.2cqw}
#hud .sp{flex:1;background:none;border:0}
#hud button{pointer-events:auto}
body.cine #hud{opacity:0}
.off{display:none!important}
.fx{position:absolute;inset:0;pointer-events:none;opacity:0}
#fade{background:#000;z-index:30;transition:opacity .4s}
#flash{background:#fff;z-index:29}
#stage.shake{animation:shake .38s}
@keyframes shake{10%{transform:translate(-1.2%,.6%)}30%{transform:translate(1.4%,-.8%)}50%{transform:translate(-1%,-.5%)}70%{transform:translate(.9%,.7%)}90%{transform:translate(-.4%,.2%)}}
.btn{font-family:inherit;font-weight:800;font-size:max(13px,2.1cqw);background:var(--amber);color:#1a1405;border:.3cqw solid #000;box-shadow:0 .55cqw 0 #8a6a1f;padding:.8cqw 2.4cqw;cursor:pointer}
.btn:active{transform:translateY(.4cqw);box-shadow:0 .15cqw 0 #8a6a1f}
.btn:focus-visible,.cand:focus-visible,.card:focus-visible,.lane:focus-visible{outline:.35cqw solid var(--neon);outline-offset:.3cqw}
.btn.big{font-size:max(15px,3cqw);padding:1cqw 4cqw}
.btn.ghost{background:rgba(5,6,16,.78);color:var(--ink);box-shadow:0 .4cqw 0 #000;font-size:max(11px,1.7cqw);padding:.35cqw 1.2cqw;border-color:var(--line)}
#ui{position:absolute;inset:0;z-index:10;pointer-events:none}
#ui>*{pointer-events:auto}
.panel{position:absolute;background:var(--panel);border:.35cqw solid var(--line);box-shadow:0 0 0 .3cqw #000,.9cqw .9cqw 0 rgba(0,0,0,.65);padding:1.4cqw 2cqw}
.panel h2{margin:0 0 .5cqw;font-size:max(15px,2.9cqw);color:var(--amber)}
.panel .sub{margin:0 0 1.2cqw;font-size:max(12px,1.8cqw);color:#c9cdf2;line-height:1.5}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:12;gap:1.3cqw;background:radial-gradient(ellipse at center,rgba(5,6,16,.2),rgba(5,6,16,.82))}
#title h1{margin:0;font-size:9cqw;line-height:1;font-weight:800;text-shadow:.5cqw .5cqw 0 var(--red),-.3cqw -.3cqw 0 #1b6dff}
#title .px{font-family:'Press Start 2P',monospace;font-size:max(9px,1.5cqw);color:var(--neon);letter-spacing:.2cqw}
#title p{margin:0;font-size:max(13px,2cqw);color:#d6daff;max-width:70cqw;line-height:1.6}
#title small{font-size:max(10px,1.5cqw);color:#9aa0d6}
#toast{position:absolute;z-index:11;top:5cqw;left:50%;transform:translateX(-50%);max-width:70cqw;text-align:center;opacity:0;transition:opacity .35s;pointer-events:none}
#toast.on{opacity:1}
#toast b{display:block;color:var(--neon);font-size:max(13px,2.2cqw)}
#toast span{font-size:max(11px,1.7cqw);color:#d6daff}
#hint{position:absolute;z-index:11;left:2cqw;bottom:2cqw}
/* level 2 */
.p2{left:50%;top:52%;transform:translate(-50%,-50%);width:84cqw}
.print-row{display:flex;gap:3cqw;align-items:center;direction:rtl}
.ev{margin:0;position:relative;text-align:center;font-size:max(11px,1.6cqw);color:#e8d9a0}
.ev canvas{width:19cqw;height:19cqw;border:.3cqw solid #000;background:#cdbe8c;image-rendering:pixelated;display:block}
.scan{position:absolute;left:0;right:0;top:0;height:.5cqw;background:var(--neon);box-shadow:0 0 1.2cqw var(--neon);animation:scan 2.2s linear infinite}
@keyframes scan{0%{top:0}100%{top:19cqw}}
.cands{display:flex;gap:2cqw;flex:1;justify-content:center}
.cand{font-family:inherit;color:var(--ink);background:#14172f;border:.3cqw solid var(--line);padding:1cqw;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.4cqw;box-shadow:0 .5cqw 0 #000}
.cand canvas{width:14cqw;height:14cqw;border:.25cqw solid #000;image-rendering:pixelated;display:block}
.cand b{font-size:max(12px,1.9cqw)}.cand small{font-size:max(10px,1.4cqw);color:#aab0e6}
.cand:hover:not(:disabled){border-color:var(--amber);transform:translateY(-.4cqw)}
.cand.bad{opacity:.45;border-color:var(--red)}
.cand.good{border-color:var(--neon);box-shadow:0 0 2cqw var(--neon)}
.msg{min-height:1.5em;margin:1cqw 0 0;font-size:max(12px,1.8cqw);font-weight:800;color:var(--amber)}
/* level 3 */
.p3{left:50%;top:52%;transform:translate(-50%,-50%);width:66cqw;text-align:center}
.gelwrap{direction:ltr}
.gelwrap canvas{width:100%;display:block;image-rendering:pixelated;border:.3cqw solid #000}
.lanes{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:.6cqw}
.lane{direction:rtl;font-family:inherit;font-size:max(11px,1.6cqw);font-weight:800;padding:.7cqw .2cqw;color:var(--ink);background:#14172f;border:.25cqw solid var(--line);cursor:pointer}
.lane:disabled{cursor:default;opacity:.55}
.lane.lbl{background:#2a1520;border-color:var(--red);cursor:default;opacity:1}
.lane small{display:block;font-size:max(9px,1.2cqw);color:#aab0e6;font-weight:600}
.lane:hover:not(:disabled):not(.lbl){border-color:var(--amber)}
.lane.bad{border-color:var(--red);opacity:.5}.lane.good{border-color:var(--neon);box-shadow:0 0 1.5cqw var(--neon)}
/* level 4 */
.p4{left:6cqw;right:6cqw;bottom:9.5cqw;padding:1cqw 1.6cqw}
.hearts{font-size:max(12px,1.8cqw);font-weight:800;margin-bottom:.8cqw;color:#c9cdf2}
.hearts i{color:var(--red);font-style:normal;letter-spacing:.2cqw}
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:1.2cqw}
.card{font-family:inherit;color:var(--ink);background:#14172f;border:.3cqw solid var(--line);padding:.8cqw .4cqw;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.3cqw;box-shadow:0 .4cqw 0 #000}
.card i{font-style:normal;font-size:max(18px,3.4cqw)}
.card b{font-size:max(10px,1.5cqw)}
.card:hover{border-color:var(--amber);transform:translateY(-.3cqw)}
/* fact */
.fact{left:50%;top:50%;transform:translate(-50%,-50%);width:56cqw;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1cqw}
.fact .ic{font-size:6cqw;line-height:1}
.fact p{margin:0;font-size:max(13px,2cqw);line-height:1.65;color:#dfe2ff}
/* result */
.res{left:50%;top:50%;transform:translate(-50%,-50%);width:62cqw;text-align:center;display:flex;flex-direction:column;align-items:center;gap:.8cqw}
.res .stamp{border:.8cqw solid var(--red);color:var(--red);font-weight:800;font-size:6cqw;padding:.2cqw 2.4cqw;transform:rotate(-8deg);animation:stamp .55s cubic-bezier(.2,1.6,.4,1) both;text-shadow:.2cqw .2cqw 0 #000}
@keyframes stamp{0%{transform:rotate(-8deg) scale(3);opacity:0}100%{transform:rotate(-8deg) scale(1);opacity:1}}
.res .stars{font-size:5cqw;color:var(--amber);letter-spacing:.8cqw}
.res p{margin:0;font-size:max(13px,2cqw);color:#dfe2ff}
.res .row{display:flex;gap:1.5cqw;margin-top:.6cqw}
#rotate{display:none;position:fixed;inset:0;z-index:99;background:#05060c;color:#fff;align-items:center;justify-content:center;text-align:center;font-size:20px;font-weight:800;padding:24px}
@media (orientation:portrait) and (max-width:700px){#rotate{display:flex}}
@media (prefers-reduced-motion:reduce){.scan{animation:none}#stage.shake{animation:none}}
</style>
</head>
<body>
<div id="rotate">📱↻<br>قلّب الجوال بالوضع الأفقي لتجربة أفضل</div>
<div id="stage">
  <canvas id="c" aria-label="مشهد اللعبة"></canvas>
  <div class="bar t"></div><div class="bar b"></div>
  <div id="hud" class="off">
    <span id="hLevel"></span><span id="hEv"></span><span class="sp"></span><span id="hScore"></span>
    <button class="btn ghost" id="hMute" aria-label="كتم الصوت">🔊</button>
  </div>
  <div id="toast"></div>
  <button class="btn ghost off" id="hint">💡 تلميح (−٥٠)</button>
  <div id="ui"></div>
  <div id="cap" aria-live="polite"></div>
  <div id="title" class="center">
    <div class="px">CASE FILE #07</div>
    <h1>ملفات الجريمة</h1>
    <p>سُرقت «الماسة الزرقاء» من المتحف الوطني ولم يُكسر قفلٌ واحد. اقرأ مسرح الجريمة، حلّل البصمات والـDNA، وواجه الجاني بالأدلة.</p>
    <button class="btn big" id="start">ابدأ التحقيق ▶</button>
    <small>٤ مراحل · يُفضَّل تشغيل الصوت · انقر على الشاشة لتسريع الحوارات</small>
    <button class="btn ghost" id="fs">ملء الشاشة ⛶</button>
  </div>
  <div id="flash" class="fx"></div>
  <div id="fade" class="fx" style="opacity:0"></div>
</div>

<script>
'use strict';
/* ============ أساسيات ============ */
const W=320,H=180;
const $=s=>document.querySelector(s);
const stage=$('#stage'),cv=$('#c'),g=cv.getContext('2d');
cv.width=W;cv.height=H;g.imageSmoothingEnabled=false;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const R=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),w,h)};
const rng=seed=>{let s=seed>>>0;return()=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296}};
const ar=n=>Number(n).toLocaleString('ar-EG');
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const dist=(a,b,c,d)=>Math.hypot(a-c,b-d);

/* ============ صوت ============ */
let AC=null,muted=false;
function beep(f=440,d=.08,type='square',v=.04,slide=0){
  if(muted)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),gn=AC.createGain();
    o.type=type;o.frequency.value=f;
    if(slide)o.frequency.linearRampToValueAtTime(Math.max(30,f+slide),AC.currentTime+d);
    gn.gain.value=v;gn.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);
    o.connect(gn);gn.connect(AC.destination);o.start();o.stop(AC.currentTime+d);
  }catch(e){}
}
const sfx={
  tick:()=>beep(880,.025,'square',.02),
  ok:()=>{beep(660,.1);setTimeout(()=>beep(990,.16),90)},
  bad:()=>beep(170,.28,'sawtooth',.05,-90),
  find:()=>{beep(520,.08);setTimeout(()=>beep(780,.08),70);setTimeout(()=>beep(1040,.15),140)},
  hit:()=>{beep(80,.5,'sawtooth',.07,-40);beep(55,.6,'square',.05)},
  win:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.18,'square',.05),i*120))
};
$('#hMute').onclick=e=>{e.stopPropagation();muted=!muted;e.target.textContent=muted?'🔇':'🔊'};

/* ============ رسم الشخصيات بالبكسل ============ */
function person(x,y,o={}){
  const s=o.skin||'#f2c49b',coat=o.coat||'#555',pants=o.pants||'#222',hair=o.hair||'#2a1a10';
  y=Math.round(y+(o.bob||0));
  const st=o.walk?Math.floor(o.walk*6)%2:0;
  R(x+2,y+23,12,1,'rgba(0,0,0,.35)');
  R(x+4,y+17,3,6-(st?1:0),pants);R(x+9,y+17,3,6-(st?0:1),pants);
  R(x+3,y+22-(st?1:0),4,2,'#111');R(x+9,y+22-(st?0:1),4,2,'#111');
  R(x+3,y+9,10,9,coat);R(x+7,y+9,2,9,o.shirt||'#dedede');
  if(o.tie)R(x+7,y+10,2,5,o.tie);
  if(o.apron)R(x+4,y+11,8,7,'#ece5d2');
  R(x+1,y+10,2,7,coat);R(x+13,y+10,2,7,coat);
  R(x+1,y+17,2,2,s);R(x+13,y+17,2,2,s);
  if(o.bandage){R(x+13,y+16,2,3,'#fff');R(x+14,y+17,1,1,'#c4212f')}
  R(x+4,y+2,8,7,s);R(x+4,y+1,8,2,hair);R(x+3,y+2,1,3,hair);R(x+12,y+2,1,3,hair);
  if(o.longhair){R(x+3,y+2,1,9,hair);R(x+12,y+2,1,9,hair)}
  if(o.hat){R(x+2,y+1,12,2,o.hat);R(x+4,y-2,8,3,o.hat);R(x+4,y,8,1,o.band||'#000')}
  if(o.cap){R(x+3,y-1,10,3,o.cap);R(x+3,y+2,11,1,'#0a0a0a');R(x+7,y,2,1,'#e0c24a')}
  const ey=y+5,e=o.eyes||'n';
  if(e==='n'){R(x+6,ey,1,2,'#111');R(x+9,ey,1,2,'#111')}
  else if(e==='s'){R(x+5,ey+1,3,1,'#111');R(x+9,ey+1,3,1,'#111');R(x+5,ey-1,3,1,'#2a1a10');R(x+9,ey-1,3,1,'#2a1a10')}
  else{R(x+5,ey-1,3,3,'#fff');R(x+9,ey-1,3,3,'#fff');R(x+6,ey,1,1,'#111');R(x+10,ey,1,1,'#111')}
  if(o.glass){R(x+5,ey-1,3,1,'#222');R(x+9,ey-1,3,1,'#222');R(x+5,ey+1,3,1,'#222');R(x+9,ey+1,3,1,'#222')}
  R(x+7,y+8,2,1,o.frown?'#4a1c1c':'#7a3a3a');
  if(o.sweat){const k=(o.t||0)*9%8;R(x+13,y+2+k,1,2,'#8fd8ff');if(o.sweat>1)R(x+3,y+3+((k+4)%8),1,2,'#8fd8ff')}
}
function bigPerson(x,y,s,o){g.save();g.translate(x,y);g.scale(s,s);person(0,0,o);g.restore()}

const S=[
 {name:'سعيد',role:'حارس الأمن',o:{coat:'#1f3358',pants:'#15213b',cap:'#1f3358',hair:'#222',skin:'#e0b48a',tie:'#c9b324'},
  fp:{type:'loop',period:3.6,flip:false,seed:11,warp:.8}},
 {name:'نورة',role:'أمينة المتحف',o:{coat:'#8a4b7a',pants:'#3a2a40',hair:'#4a2020',skin:'#f0c6a0',glass:true,longhair:true},
  fp:{type:'loop',period:4.5,flip:true,seed:23,warp:1.3}},
 {name:'ماجد',role:'مرمّم اللوحات',o:{coat:'#b9a26a',pants:'#4a4030',hair:'#8a8a8a',skin:'#d9a67c',apron:true},
  fp:{type:'whorl',period:3.9,flip:false,seed:37,warp:1}}
];
const DET={coat:'#7b6a47',pants:'#2b2a33',hat:'#33291d',band:'#111',tie:'#8c1c2c',hair:'#2a1a10'};

/* ============ المشاهد ============ */
let scene=()=>{},T0=performance.now();
function setScene(f){scene=f;T0=performance.now()}
function loop(now){
  requestAnimationFrame(loop);
  g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.clearRect(0,0,W,H);
  try{scene((now-T0)/1000)}catch(e){console.error(e)}
}
requestAnimationFrame(loop);

function drawCity(t,o={}){
  const pal=o.dawn?['#2b2a55','#4a3a78','#8f4f7f','#d9786f','#f5b97a']:['#080b1f','#0c1230','#121a42','#19235a','#22306f'];
  pal.forEach((c,i)=>R(0,i*28,W,28,c));
  if(o.dawn){const sy=104-Math.min(34,t*5);R(148,sy,24,20,'#ffe9a8');R(152,sy-4,16,4,'#ffe9a8')}
  else{
    const r=rng(7);for(let i=0;i<46;i++){const x=r()*W,y=r()*80;if(Math.sin(t*2+i*3)>-.5)R(x,y,1,1,'#cfd6ff')}
    R(262,14,14,14,'#f6f1cf');R(267,13,12,13,pal[0]);
  }
  const r2=rng(21);
  for(let x=-4;x<W;x+=22){
    const h=30+r2()*50,w=18+((r2()*6)|0);
    R(x,140-h,w,h,o.dawn?'#1c1830':'#0b0d1a');
    for(let wy=140-h+4;wy<136;wy+=7)for(let wx=x+3;wx<x+w-3;wx+=5){
      if(r2()>.55&&!o.dawn)R(wx,wy,2,3,Math.sin(t*.8+wx*wy)>-.92?'#ffd36b':'#6c5d2c');
    }
  }
  // المتحف
  R(88,140,144,4,'#59556e');R(92,136,136,4,'#6b6783');
  R(100,84,120,52,'#8b86a3');
  for(let y=68;y<84;y++){const w=Math.round((y-68)/16*136);R(160-w/2,y,w,1,'#a09bb8')}
  R(96,84,128,3,'#6f6a88');
  for(let k=0;k<6;k++){R(106+k*20,87,6,49,'#bdb9d3');R(105+k*20,87,8,2,'#d6d3e8');R(106+k*20,87,1,49,'#9a96b4')}
  R(148,108,24,28,'#14121f');R(150,110,20,26,'#1b2c58');
  R(148,92,24,14,'#1d3f9e');
  [[160,94,1],[159,95,3],[158,96,5],[159,97,3],[160,98,1]].forEach(([x,y,w])=>R(x-(w-1)/2+(w>1?0:0),y,w,1,'#79d4ff'));
  [[158,96,5],[157,97,7],[158,98,5],[159,99,3],[160,100,1]].forEach(([x,y,w])=>R(x,y+2,w,1,'#79d4ff'));
  // عمود إنارة
  R(40,92,2,48,'#2b2b3b');R(34,90,14,3,'#2b2b3b');
  if(!o.dawn){g.fillStyle='rgba(255,220,130,.10)';g.beginPath();g.moveTo(36,93);g.lineTo(46,93);g.lineTo(70,142);g.lineTo(14,142);g.fill();R(36,93,10,2,'#ffe49a')}
  // أرض
  R(0,140,W,40,o.dawn?'#2a2535':'#10111c');R(0,140,W,1,'#2d2f45');
  for(let i=0;i<10;i++)R((i*37+t*3)%W,150+(i%3)*8,14,1,'rgba(160,180,255,.08)');
  // شريط الشرطة

function drawPrint(c2,p,partial){
  const n=64;c2.width=n;c2.height=n;const c=c2.getContext('2d');const im=c.createImageData(n,n),d=im.data;
  const r=rng(p.seed*7+3),mins=[];for(let i=0;i<8;i++)mins.push([12+r()*40,12+r()*40]);
  const nr=rng(partial?99:1);
  const bg=partial?[205,190,140]:[222,216,198],ink=partial?[58,44,18]:[24,28,36];
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){
    const i=(y*n+x)*4;
    if(Math.hypot(x-32,y-32)>30){d[i+3]=0;continue}
    let dx=x-32,dy=y-33;if(p.flip)dx=-dx;
    let v=p.type==='whorl'?Math.hypot(dx,dy*1.15):Math.hypot(dx,Math.min(dy+6,0)*1.1);
    v+=p.warp*Math.sin((x+y)*.2+p.seed);
    let f=v/p.period;f-=Math.floor(f);
    let ridge=f<.5;
    for(const m of mins)if(Math.hypot(x-m[0],y-m[1])<2.2)ridge=!ridge;
    const vis=partial?(Math.hypot(x-38,y-30)<23&&nr()>.1):true;
    const col=(vis&&ridge)?ink:bg;
    d[i]=col[0];d[i+1]=col[1];d[i+2]=col[2];d[i+3]=255;
  }
  c.putImageData(im,0,0);
}

        await sleep(2200);res();
      }else{
        b.classList.add('bad');b.disabled=true;sfx.bad();shake();addScore(-50);
        msg.textContent='لا تتطابق: قارن النمط وتباعد الخطوط من جديد. (−٥٠)';
      }
    };
  });
  await panelFact('🖐️','بصمتك لا تتكرر','تتشكل بصمات الأصابع في الأشهر الأولى من الحمل، وتبقى ثابتة مدى الحياة، ولا تتطابق حتى بين التوائم المتماثلة.');
}

async function level3(){
  state.level=3;await fade(1,300);ui('');clearCap();
  setScene(drawLab);hudLevel('المرحلة ٣: مختبر الحمض النووي');await fade(0,500);
  say('البصمة تُشير إلى مشتبه... لكن الدم يحسم القضية.','المحقق');
  const c=state.culprit,all=[...Array(12).keys()];
  const base=shuffle(all).slice(0,7).sort((a,b)=>a-b);
  const mutate=(b,k)=>{const s=new Set(b);shuffle(b).slice(0,k).forEach(v=>s.delete(v));shuffle(all.filter(i=>!b.includes(i))).slice(0,k).forEach(v=>s.add(v));return [...s].sort((a,b)=>a-b)};
  const pats=S.map((_,i)=>i===c?base:mutate(base,i===(c+1)%3?2:3));
  const order=shuffle([0,1,2]);
  const lanes=[{name:'عينة الدم',small:'من مسرح الجريمة',pat:base,ev:true},...order.map(i=>({name:S[i].name,small:S[i].role,pat:pats[i],i}))];
  ui(`<div class="panel p3"><h2>الفصل الكهربائي للـDNA</h2>
    <p class="sub" id="dnaMsg">جاري الفصل الكهربائي... القطع الأصغر تسافر أبعد.</p>
    <div class="gelwrap"><canvas id="gel" width="160" height="96"></canvas>
    <div class="lanes">${lanes.map(l=>l.ev?`<div class="lane lbl">${l.name}<small>${l.small}</small></div>`:`<button class="lane" disabled data-act="lane" data-i="${l.i}">${l.name}<small>${l.small}</small></button>`).join('')}</div></div></div>`);
  const gc=$('#gel').getContext('2d'),noise=rng(5);
  const bgn=[];for(let i=0;i<300;i++)bgn.push([noise()*160,noise()*96,noise()]);
  const dur=3200,t0=performance.now();
  let lit=null;
  const frame=()=>{
    const p=Math.min(1,(performance.now()-t0)/dur),e=1-Math.pow(1-p,3);
    gc.fillStyle='#0a1c2b';gc.fillRect(0,0,160,96);
    bgn.forEach(([x,y,a])=>{gc.fillStyle=`rgba(40,120,150,${.05+a*.08})`;gc.fillRect(x,y,2,1)});
    lanes.forEach((l,li)=>{
      gc.fillStyle='#03101a';gc.fillRect(li*40+6,3,28,5);
      l.pat.forEach(s=>{
        const fy=14+s*6.6,y=8+(fy-8)*e;
        gc.fillStyle='rgba(140,255,216,.22)';gc.fillRect(li*40+6,Math.round(y)-1,28,4);
        gc.fillStyle='#8affd8';gc.fillRect(li*40+7,Math.round(y),26,2);
      });
    });
    if(lit!==null){gc.strokeStyle='#ffc857';gc.lineWidth=1;gc.strokeRect(1.5,1.5,37,93);gc.strokeRect(lit*40+1.5,1.5,37,93)}
    if(p<1||lit===null)requestAnimationFrame(frame);
  };
  frame();
  await sleep(dur+200);
  document.querySelectorAll('.lane[data-act]').forEach(b=>b.disabled=false);
  $('#dnaMsg').textContent='اكتمل الفصل. أي مشتبه تتطابق حزمه مع عينة الدم تماماً؟';
  await new Promise(res=>{
    handlers.lane=async b=>{
      const i=+b.dataset.i,msg=$('#dnaMsg');
      if(i===c){
        document.querySelectorAll('.lane[data-act]').forEach(x=>x.disabled=true);
        b.classList.add('good');lit=lanes.findIndex(l=>l.i===i);sfx.ok();flash();addScore(200);
        msg.textContent=`تطابق ٧ من ٧ حزم: الدم يعود إلى ${S[c].name}!`;
        await sleep(2400);res();
      }else{
        const a=new Set(pats[i]),diff=base.filter(x=>!a.has(x)).length;
        b.classList.add('bad');b.disabled=true;sfx.bad();shake();addScore(-50);
        msg.textContent=`لا تتطابق: ${ar(diff)} حزم مختلفة. (−٥٠)`;
      }
    };
  });
  await panelFact('🧬','بصمة الحمض النووي','ظهرت تقنية بصمة DNA عام ١٩٨٤ على يد العالم أليك جيفريز. الفصل الكهربائي يرتّب قطع الـDNA حسب حجمها، فيظهر نمط فريد يشبه الباركود.');
}

const CARDS=[
 {id:'fp',icon:'🖐️',name:'تقرير البصمات'},
 {id:'dna',icon:'🧬',name:'نتيجة الـDNA'},
 {id:'fiber',icon:'🧵',name:'ألياف النافذة'},
 {id:'shoe',icon:'👟',name:'أثر الحذاء',bad:'المقاس شائع بين كثيرين... لا يكفي وحده.'},
 {id:'tool',icon:'🔧',name:'أداة القص',bad:'الأداة بلا بصمات واضحة... دليل ضعيف هنا.'}
];
const ROUNDS=[
 {lie:'ما دخلت قاعة العرض أبداً، ولا لمست الخزانة!',right:'fp',win:'بصمتك على زجاج الخزانة تطابق سجلّك تماماً.'},
 {lie:'يدي سليمة، ما انجرحت بشيء الليلة.',right:'dna',win:'الدم على الأرض يطابق حمضك النووي، وضمادتك تفضحك.'},
 {lie:'ولا لبست هالجاكيت الرمادي، ولا اقتربت من النافذة!',right:'fiber',win:'ألياف النافذة من نسيج جاكيتك المعلّق خلفك.'}
];
const hearts=n=>'♥'.repeat(n)+'♡'.repeat(3-n);
async function level4(){
  state.level=4;state.hearts=3;state.sweat=0;state.detEyes='s';state.suspEyes='n';
  await fade(1,300);ui('');clearCap();cinema(false);
  setScene(drawInterro);hudLevel('المرحلة ٤: الاستجواب');await fade(0,600);
  const c=state.culprit,who=S[c].name;
  const draw=()=>ui(`<div class="panel p4"><div class="hearts">ثقة اللجنة: <i>${hearts(state.hearts)}</i> · اعرض الدليل الذي يكشف كذبته</div>
    <div class="cards">${CARDS.map(k=>`<button class="card" data-act="ev" data-id="${k.id}"><i>${k.icon}</i><b>${k.name}</b></button>`).join('')}</div></div>`);
  await line(`${who} متوتر... وعيناه تتجنبان المحقق.`,1500);
  let r=0;
  const ask=()=>{draw();say(ROUNDS[r].lie,who)};
  ask();
  await new Promise(res=>{
    handlers.ev=async b=>{
      const id=b.dataset.id,rd=ROUNDS[r];
      if(id===rd.right){
        ui('');sfx.ok();flash();shake();addScore(150);state.sweat=r+1;state.suspEyes='w';
        await line(rd.win,2000,'المحقق');
        r++;
        if(r>=ROUNDS.length)return res();
        state.suspEyes='n';ask();
      }else{
        const k=CARDS.find(x=>x.id===id);
        state.hearts--;sfx.bad();shake();addScore(-50);
        if(state.hearts<=0){
          ui('');await line('ابتسم المشتبه بثقة... أعد ترتيب أدلتك وحاول مجدداً.',2400,'المحقق');
          state.hearts=3;r=0;state.sweat=0;state.suspEyes='n';ask();
        }else{
          draw();say(k.bad||'دليل قوي... لكنه لا يكذّب هذه الجملة تحديداً.','المحقق');
        }
      }
    };
  });
  await eyesShot(3000,'لا مزيد من الأكاذيب. انتهت اللعبة.');
  await fade(1,200);setScene(drawInterro);state.suspEyes='w';state.detEyes='s';await fade(0,400);
  await line('...حسناً. أنا من أخذ الماسة. أردت أن أبيعها.',2600,who);
  await line('كل تفصيلة تركتها كانت تدلّ عليك. العلم لا يكذب.',2600,'المحقق');
  addScore(0);
}

async function ending(){
  await fade(1,500);ui('');hudUpdate();$('#hud').classList.add('off');cinema(true);clearCap();
  setScene(t=>drawCity(t,{dawn:true,detX:196}));await fade(0,900);sfx.win();
  const c=state.culprit;
  await line('مع شروق الشمس... أُغلق الملف.',2200);
  await line(`الجاني: ${S[c].name}، ${S[c].role}. والماسة الزرقاء عادت إلى مكانها.`,3000);
  const sc=state.score,stars=sc>=1150?3:sc>=850?2:1,rank=['محقق متدرّب','محقق خبير','محقق أسطوري'][stars-1];
  clearCap();
  ui(`<div class="panel res"><div class="stamp">القضية أُغلقت</div>
    <div class="stars">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
    <h2>${rank}</h2><p>النقاط: ${ar(sc)}</p>
    <p>الجاني: ${S[c].name} — ${S[c].role}</p>
    <div class="row"><button class="btn" data-act="again">قضية جديدة (جانٍ مختلف)</button></div></div>`);
  handlers.again=()=>{ui('');showTitle()};
}

/* ============ التشغيل ============ */
function showTitle(){
  cinema(false);clearCap();ui('');$('#hud').classList.add('off');$('#hint').classList.add('off');
  $('#title').classList.remove('off');setScene(t=>drawCity(t,{detX:196}));fade(0,400);
}
async function play(){
  $('#title').classList.add('off');
  Object.assign(state,{score:0,culprit:Math.floor(Math.random()*3),got:0,hearts:3,sweat:0,playing:false,level:0,hint:null});
  try{
    await intro();await level1();await level2();await level3();await level4();await ending();
  }catch(e){console.error(e);showTitle()}
}
$('#start').onclick=e=>{e.stopPropagation();beep(440,.05);play()};
showTitle();
</script>
